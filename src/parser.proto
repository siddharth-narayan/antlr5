syntax = "proto3";

message Parser {
  repeated ParserRule rules = 1;
}

message Lexer {
  repeated LexerRule rules = 1;
}

message ParserRule {
  uint32 start = 1;
  uint32 stop = 2;
}

message LexerRule {
  uint32 start = 1;
  uint32 stop = 2;
  uint32 token = 3;
}

message State {
  repeated uint32 transitions = 1; 
}

